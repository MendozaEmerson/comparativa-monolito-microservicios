# ==============================================================================
# STRANGLER FIG API GATEWAY (NGINX) — HI.EVENTS BENCHMARK
# Redirección selectiva de rutas para desacoplar el módulo de reservas
# ==============================================================================

events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Optimización de rendimiento
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Upstream: Monolito residual Hi.Events (Catálogo, Auth, Dashboard)
    upstream hievents_core {
        server hievents-core:80;
        keepalive 32;
    }

    # Upstream: Microservicio extraído de Reservas (Alta concurrencia)
    upstream reservation_service {
        server ticket-reservation-service:3001;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Logs de acceso y error
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;

        # ----------------------------------------------------------------------
        # ESTRANGULAMIENTO 1: Creación de Órdenes / Reservas (POST)
        # Intercepta POST /api/events/{event_id}/orders hacia el Microservicio
        # ----------------------------------------------------------------------
        location ~* ^/api/events/([^/]+)/orders {
            proxy_pass http://reservation_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Strangler-Fig "true";

            # Timeout ajustado para pruebas de carga
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        # ----------------------------------------------------------------------
        # ESTRANGULAMIENTO 2: Endpoint directo de Reservas / Salud del Microservicio
        # ----------------------------------------------------------------------
        location /api/reservations {
            proxy_pass http://reservation_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health/reservations {
            proxy_pass http://reservation_service/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ----------------------------------------------------------------------
        # RUTAS RESIDUALES: Todo el resto de la aplicación va al Monolito Hi.Events
        # (Catálogo público, panel organizador, frontend React, autenticación)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://hievents_core;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}

